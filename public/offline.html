<!doctype html>
<html lang="pt-AO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7f2" />
    <title>Sem ligação · Creative Society</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #fbf7f2; --card: #fffdfa; --ink: #3b2a22; --muted: #8a7465; --primary: #b4593c; --on: #fff8f3; --soft: #f8ebd3; --warn: #b07418; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1b1411; --card: #241b17; --ink: #f3e9e0; --muted: #ae9b8d; --primary: #e08a68; --on: #2a140b; --soft: #3a2c14; --warn: #e3b05e; } }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
      .card { max-width: 380px; width: 100%; background: var(--card); border-radius: 24px; padding: 32px 24px; text-align: center; box-shadow: 0 10px 30px -14px rgb(59 42 34 / 0.2); }
      .badge { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 20px; display: grid; place-items: center; background: var(--soft); color: var(--warn); }
      h1 { font-family: Georgia, serif; font-size: 24px; margin: 0 0 8px; }
      p { color: var(--muted); line-height: 1.55; margin: 0 0 12px; font-size: 15px; }
      button { margin-top: 12px; width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--primary); color: var(--on); font-size: 16px; font-weight: 600; cursor: pointer; }
      .hint { font-size: 13px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="badge" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
        </div>
        <h1>Sem ligação à internet</h1>
        <p>Esta página precisa de internet para mostrar dados atualizados.</p>
        <p>O carrinho do ponto de venda fica guardado neste aparelho — nada se perde.</p>
        <button type="button" onclick="location.reload()">Tentar de novo</button>
        <p class="hint">A página volta sozinha quando a ligação regressar.</p>
      </div>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
